name: Physics performance

# Times the physics scenarios in test/bench-physics.mjs on the pull request's dist/ against the
# dist/ of its merge base, with upstream box3d.js for reference, and posts the report on the pull
# request. Runs when a pull request is
# opened or marked ready for review, and again whenever a maintainer comments with 📊.
# It times the committed dist/, so a pull request that changes src/ must rebuild it to be measured.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

# A new request cancels the one in flight. Every other comment gets a group of its own, so it
# cannot cancel a run on the way to skipping its jobs.
concurrency:
  group: physics-perf-${{ github.event.pull_request.number || github.event.issue.number }}-${{ (github.event_name == 'pull_request' || contains(github.event.comment.body, '📊')) && 'bench' || github.run_id }}
  cancel-in-progress: true

jobs:
  acknowledge:
    # A 👀 on the 📊 comment, so the requester knows the run started
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(github.event.comment.body, '📊') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: React to the comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes

  bench:
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(github.event.comment.body, '📊') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # This job runs the pull request's code, so it gets a read only token and no secrets
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$NUMBER" \
            --jq '"number=\(.number)\nhead=\(.head.sha)\nbase=\(.base.ref)"' >> "$GITHUB_OUTPUT"

      - name: Checkout the pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract the base build
        id: base
        env:
          BASE_REF: ${{ steps.pr.outputs.base }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          mkdir -p .bench/base
          git archive "$base" dist | tar -x -C .bench/base
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Fetch the reference build
        # Upstream box3d.js (isaac-mason/box3d.js) from npm: erincatto/box3d at 8441b4a, without this
        # fork's engine changes, built to wasm. It has the same API, so the same scenarios run on it,
        # except the wheeled vehicles, which it lacks. npm pack only downloads: it runs no scripts.
        env:
          REFERENCE: box3d.js@0.1.1
        run: |
          mkdir -p .bench/reference
          file=$(cd .bench && npm pack "$REFERENCE" --silent)
          tar -xzf ".bench/$file" -C .bench/reference

      - name: Run the scenarios
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BASE_REF: ${{ steps.pr.outputs.base }}
        # A failed comparison still writes its report, which says what failed: publish it, then fail
        run: |
          status=0
          node test/bench-physics-compare.mjs \
            --base .bench/base/dist --head dist --runs 7 \
            --reference .bench/reference/package/dist \
            --reference-label "upstream box3d.js 0.1.1 (erincatto/box3d @ 8441b4a)" \
            --base-label "$BASE_REF @ ${BASE_SHA::7} (merge base)" \
            --head-label "#${{ steps.pr.outputs.number }} @ ${HEAD_SHA::7}" \
            --markdown .bench/report.md --json .bench/runs.json || status=$?
          if [ -f .bench/report.md ]; then cat .bench/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-perf
          path: |
            .bench/report.md
            .bench/runs.json
          if-no-files-found: ignore

  comment:
    needs: bench
    # Posts the report, also of a failed comparison. When a fork's pull request opens, its token is
    # read only, so that report stays in the job summary. A maintainer's 📊 on a fork's pull request
    # does post: the run then has a write token, and this job runs none of the pull request's code.
    if: >-
      !cancelled() && needs.bench.result != 'skipped' &&
      (github.event_name == 'issue_comment' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # No checkout: this job only posts the report
    permissions:
      pull-requests: write
    steps:
      - name: Download the report
        # a run that failed before writing a report has none to post
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: physics-perf

      - name: Comment on the pull request
        if: hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.bench.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            cat report.md
            echo
            echo "<sub>[Workflow run]($RUN_URL). Comment with the bar chart emoji to measure again.</sub>"
          } > comment.md
          gh pr comment "$NUMBER" --repo "${{ github.repository }}" --body-file comment.md
